name: Import restrained minimalist medicine photos once
on:
  push:
    branches: ['codex/medicine-premium-redesign-20261008']
    paths:
      - 'scripts/import_minimalist_medicine_photos.py'
      - '.github/workflows/import-minimalist-medicine.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - run: python scripts/import_minimalist_medicine_photos.py
      - name: Commit only generated pictures, preserving current application source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/medicine_minimal_hero.webp app/src/main/res/drawable-nodpi/medicine_minimal_card.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: add neutral minimalist medicine photography'
          git push origin HEAD:codex/medicine-premium-redesign-20261008
