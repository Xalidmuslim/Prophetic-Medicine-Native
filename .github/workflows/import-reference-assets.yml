name: Import user-provided visual reference assets once
on:
  push:
    branches: [codex/medicine-premium-redesign-20261008]
    paths: [.github/workflows/import-reference-assets.yml, scripts/import_medicine_reference_assets.py]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Restore photographed reference crops without altering book data
        run: |
          python scripts/import_medicine_reference_assets.py
          test -s app/src/main/res/drawable-nodpi/medicine_photo_hero.webp
          test -s app/src/main/res/drawable-nodpi/medicine_photo_reading.webp
          test -s app/src/main/res/drawable-nodpi/medicine_photo_treatments.webp
          test -s app/src/main/res/drawable-nodpi/medicine_photo_app_icon.webp
          test "$(find app/src/main/res/drawable-nodpi -name 'medicine_photo_*.webp' | wc -l)" -eq 11
      - name: Commit local Android art assets to THIS branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/medicine_photo_*.webp design/REFERENCE_ASSET_PROVENANCE.md
          git diff --cached --quiet && exit 0
          git commit -m "assets: restore realistic photo details directly from owner reference"
          git push origin HEAD:codex/medicine-premium-redesign-20261008
