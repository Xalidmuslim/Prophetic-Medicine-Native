name: Medicine Home First-Frame Release Test

on:
  push:
    branches: [codex/medicine-home-first-frame-20261010, codex/medicine-clean-app-name-20261010]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build optimized (R8) release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature and artifact integrity
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep 'firstframe'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -F 'Медицина Пророка ﷺ'
          ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -F 'тест плавности'
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Medicine-Proper-Name-Optimized-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
