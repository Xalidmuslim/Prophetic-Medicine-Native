name: Medicine visual smoke QA (native emulator)
on:
  push:
    branches: ['codex/medicine-premium-redesign-20261008']
    paths:
      - '.github/workflows/android-visual-qa.yml'
      - 'scripts/medicine_visual_qa.sh'
      - 'app/src/main/java/com/xalid/meditsinaproroka/nativeapp/Theme.kt'
      - 'app/src/main/java/com/xalid/meditsinaproroka/nativeapp/PremiumHome.kt'
      - 'app/src/main/java/com/xalid/meditsinaproroka/nativeapp/ReferenceHome.kt'
      - 'app/src/main/res/drawable-nodpi/medicine_photo_*.webp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-emulator-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build complete native APK and verify protected book
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/assets/book.json)" = b7f9447d88791cec4eb29aefdbe270fb1f972bcd
          test "$(git hash-object app/src/main/java/com/xalid/meditsinaproroka/nativeapp/Reader.kt)" = 62a8db97fa5c252c1cef23f69ed3ca725eb7faa1
          test "$(git hash-object app/src/main/java/com/xalid/meditsinaproroka/nativeapp/Store.kt)" = 1a0e9a916039823582cbdb6a961629f1919f3b3d
          gradle :app:assembleDebug --no-daemon
      - name: Emulator startup and screenshots (Pixel 6 / API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/medicine_visual_qa.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Medicine-Native-Visual-QA
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
