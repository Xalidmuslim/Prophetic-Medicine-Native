name: Import generated medicinal card illustrations once

on:
  push:
    branches: ['codex/medicine-premium-redesign-20261008']
    paths:
      - 'scripts/import_generated_medicine_assets.py'
      - '.github/workflows/import-generated-medicine-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current native branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Import all three offline WebP illustrations
        run: |
          set -euo pipefail
          python scripts/import_generated_medicine_assets.py
          for f in medicine_topic_unified medicine_photo_treatments_new medicine_photo_reading_new; do
            test -s "app/src/main/res/drawable-nodpi/${f}.webp"
          done
      - name: Commit image resources to existing work branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/medicine_topic_unified.webp
          git add app/src/main/res/drawable-nodpi/medicine_photo_treatments_new.webp
          git add app/src/main/res/drawable-nodpi/medicine_photo_reading_new.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: bundle generated herbal icon and therapeutic card photos"
          git push origin HEAD:codex/medicine-premium-redesign-20261008
