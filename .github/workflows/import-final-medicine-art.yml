name: Import selected native UI art (one time)
on:
  push:
    branches:
      - codex/medicine-premium-redesign-20261008
    paths:
      - scripts/import_final_medicine_art.py
      - .github/workflows/import-final-medicine-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Import 22 complete original WebP assets
        run: python scripts/import_final_medicine_art.py
      - name: Preserve app code and commit only new drawable files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/src/main/res/drawable-nodpi/medicine_more_*.webp' 'app/src/main/res/drawable-nodpi/medicine_home_icon_*.webp'
          git add app/src/main/res/drawable-nodpi/medicine_home_hero_full.webp
          git add app/src/main/res/drawable-nodpi/medicine_reading_background_full.webp
          git add app/src/main/res/drawable-nodpi/medicine_treatments_background_full.webp
          git add app/src/main/res/drawable-nodpi/medicine_hadith_frame.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: bundle final 22 non-cropped original UI illustrations'
          git push origin HEAD:codex/medicine-premium-redesign-20261008
